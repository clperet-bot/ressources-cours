<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Landlady - Audio</title>
<style>
  body {
    font-family: 'Georgia', serif;
    background-color: #1a1410;
    color: #f4e9d8;

    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;

    max-width: 500px;
    width: 100%;
  }
  .track {
    background-color: #2a2118;

    padding: 16px 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .track h2 {
    font-size: 1.05em;
    color: #f4c542;
    margin: 0 0 4px 0;
  }
  .track p {
    font-size: 0.85em;
    color: #cbb994;
    margin: 0 0 10px 0;
  }
  audio {
    width: 100%;
  }
  footer {
    margin-top: 30px;
    font-size: 0.75em;
    color: #7a6b52;
    text-align: center;
  }
